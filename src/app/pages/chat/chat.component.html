<app-header></app-header>

<div class="playground">
  <div class="card">

    <!-- Profile Top Bar Header -->
    @if (profile) {
     <div class="card-body-top"> 
        <div class="fotoperfil"> 
          <img [src]="(profile.img || '') | imagenPipe: 'profiles'" alt="Perfil"> 
        </div> 
        <div class="perfil"> 
          <h2 class="name">{{ profile.first_name }} {{ profile.last_name }}</h2> 
          <span class="user-status">Activo</span>
        </div> 
        <div class="actions"> 
          <app-backButtn [pageTitle]="pageTitle"></app-backButtn> 
        </div> 
      </div> 
    }

    <div class="clear"></div>

    <!-- Chat Area Section -->
    <div style="margin-top: 120px; ">
      <div class="chat-container">

        <div class="messages-list" #messagesList>
          @for (msg of messages(); track msg._id) {

          <!-- CORREGIDO: Comparamos el string msg.de contra el user.uid de tu sesión -->
          <div [ngClass]="{'mi-mensaje': msg.de === user.uid, 'su-mensaje': msg.de !== user.uid}">

            <div class="mensaje-contenido">
              <p>{{ msg.message }}</p>

              <span class="mensaje-hora">
                {{ msg.createdAt | date:'HH:mm' }}
              </span>
            </div>

          </div>
          } @empty {
          <p class="text-center text-muted">No hay mensajes anteriores. ¡Empieza la conversación!</p>
          }
        </div>

      </div>
    </div>


    <!-- Consolidated Unified Input Box Bar Form -->
    <form class="escribir_data" (submit)="$event.preventDefault()">
      <input type="text" name="message" class="textinput" [(ngModel)]="message" (keyup.enter)="enviarMensaje()"
        placeholder="Escribe un mensaje..." autocomplete="off">

      <button type="button" class="btn btn-outline-success butonhome" (click)="enviarMensaje()">
        <i class="fa fa-arrow-circle-right" aria-hidden="true"></i>
      </button>
    </form>

  </div>
</div>
