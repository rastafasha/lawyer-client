<app-header></app-header>
<!-- (scrolled)="onScrollDown()" (scrolledUp)="onScrollUp()" -->

<section class="home" infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollUpDistance]="2"
  [infiniteScrollThrottle]=" 50" [class.refreshing]="isRefreshing">
  <div class="pull-down-indicator" *ngIf="isRefreshing">
    <app-loading></app-loading>
    <p class="text-center">
      {{'Refreshing'|translate}} ...
    </p>
  </div>
  <div class="container-fluid">
    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-sm-9 col-md-9">
          <app-backButtn [pageTitle]="pageTitle" [Title]="Title"></app-backButtn>
          <!-- <h5>Abogados</h5> -->
          <app-loading *ngIf="isLoading" [loadingTitle]="loadingTitle"></app-loading>
          <div class="post " *ngIf="!isLoading">
            <div class="group shadow" *ngFor="let item of profiles">
               <div class="foto">
                    <div class="post-date">
                      <a [routerLink]="['/especialista/', item.usuario]">
                        <img [src]="(item.img|| '') | imagenPipe : 'profiles'" alt="" />
                      </a>
                    </div>
                  </div>
                  <div class="info">
                    <h2>{{ item.first_name }}</h2>
                    <div class="div1-home">
                      
                      <app-ratingStar></app-ratingStar>
                    </div>
                  </div>
              </div>
          </div>
        </div>
        <!-- lateral -->
        <div class="col-xs-12 col-sm-3 col-md-3">
          <app-lateral></app-lateral>

        </div>
        <!-- lateral -->
      </div>
    </div>
  </div>
</section>
<app-menu-footer></app-menu-footer>
