<div class="stars">
  <ul class="star-rating">
    <li *ngFor="let star of [1,2,3,4,5]" (mouseenter)="onMouseEnter(star)" (mouseleave)="onMouseLeave()"
      (click)="onClick(star)" [class.active]="(hoverRating ? star <= hoverRating : star <= rating)">
      <i class="fa fa-star"></i>
    </li>
  </ul>
</div>
